{% extends "base.html" %}
{% block title %}Forgot password - MalSense{% endblock %}
{% block content %}
<div class="auth">
  <div class="avatar"><svg width="20" height="22" viewBox="0 0 20 22" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="9" width="16" height="12" rx="2"/><path d="M6 9V6a4 4 0 0 1 8 0v3"/><circle cx="10" cy="15" r="1.5" fill="#fff"/></svg></div>
  <h2>Forgot password?</h2>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="authtext">Enter the email address of your account. We will send you a link to choose a new password.</p>
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <button class="btn-white" type="submit">Send reset link</button>
    <p class="switch">Remembered it? <a href="{{ url_for('login') }}">Back to login</a></p>
  </form>
</div>
{% endblock %}
