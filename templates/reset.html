{% extends "base.html" %}
{% block title %}Choose a new password - MalSense{% endblock %}
{% block content %}
<div class="auth">
  <div class="avatar"><svg width="20" height="22" viewBox="0 0 20 22" fill="none" stroke="#fff" stroke-width="2"><rect x="2" y="9" width="16" height="12" rx="2"/><path d="M6 9V6a4 4 0 0 1 8 0v3"/><circle cx="10" cy="15" r="1.5" fill="#fff"/></svg></div>
  <h2>Choose a new password</h2>
  <form method="post" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">New password</label>
    <div class="field">
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <button type="button" class="eye" data-for="password" title="Show password">&#128065;</button>
    </div>
    <div class="hint">At least 8 characters, with letters and numbers.</div>
    <label for="confirm">Confirm new password</label>
    <div class="field"><input id="confirm" name="confirm" type="password" autocomplete="new-password" required></div>
    <div class="field-msg error">{{ error or "" }}</div>
    <button class="btn-white" type="submit">Save new password</button>
  </form>
</div>
{% include "_eye.html" %}
{% endblock %}
